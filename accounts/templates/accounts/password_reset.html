<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .card-header {
            background: linear-gradient(135deg, #0f3460, #533483);
            border-radius: 16px 16px 0 0 !important;
            padding: 25px 20px;
            text-align: center;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0f3460, #533483);
            border: none;
            padding: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div style="font-size: 40px; margin-bottom: 8px;">🔑</div>
            <h5 class="fw-bold mb-0">Recuperar Contraseña</h5>
            <p class="mb-0 opacity-75" style="font-size: 13px;">Te enviaremos un enlace a tu correo</p>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label fw-semibold">📧 Correo electrónico</label>
                    <input type="email" name="email" id="id_email"
                           class="form-control form-control-lg"
                           placeholder="Ingresa tu correo registrado"
                           required autofocus>
                    <div class="form-text">Ingresa el correo con el que te registraste.</div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary text-white">
                        Enviar enlace de recuperación →
                    </button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="/login/" class="text-muted" style="font-size: 14px;">← Volver al login</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
