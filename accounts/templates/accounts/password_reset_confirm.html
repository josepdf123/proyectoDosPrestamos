<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%; max-width: 440px;
            border-radius: 16px; border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .card-header {
            background: linear-gradient(135deg, #0f3460, #533483);
            border-radius: 16px 16px 0 0 !important;
            padding: 25px 20px; text-align: center; color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0f3460, #533483);
            border: none; padding: 11px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div style="font-size: 40px; margin-bottom: 8px;">🔒</div>
            <h5 class="fw-bold mb-0">Nueva Contraseña</h5>
        </div>
        <div class="card-body p-4">
            {% if validlink %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label fw-semibold">Nueva contraseña</label>
                        <input type="password" name="new_password1" id="id_new_password1"
                               class="form-control form-control-lg"
                               placeholder="Ingresa tu nueva contraseña" required>
                    </div>
                    <div class="mb-4">
                        <label for="id_new_password2" class="form-label fw-semibold">Confirmar contraseña</label>
                        <input type="password" name="new_password2" id="id_new_password2"
                               class="form-control form-control-lg"
                               placeholder="Repite tu nueva contraseña" required>
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            ⚠️ Las contraseñas no coinciden o no son válidas.
                        </div>
                    {% endif %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary text-white">
                            Guardar nueva contraseña →
                        </button>
                    </div>
                </form>
            {% else %}
                <div class="text-center py-3">
                    <div style="font-size: 48px;">⛔</div>
                    <h5 class="mt-3">Enlace inválido o expirado</h5>
                    <p class="text-muted">Este enlace ya fue usado o expiró.</p>
                    <a href="/password-reset/" class="btn btn-outline-primary mt-2">
                        Solicitar nuevo enlace
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
