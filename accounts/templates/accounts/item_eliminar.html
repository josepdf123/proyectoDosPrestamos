{% extends 'accounts/base.html' %}

{% block title %}Eliminar Item{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">🗑️ Eliminar Item</h4>
                </div>
                <div class="card-body">
                    <p class="text-danger">
                        <strong>⚠️ ADVERTENCIA:</strong> Estás a punto de eliminar <strong>{{ item.nombre }}</strong>
                    </p>
                    <p>Esta acción no se puede deshacer.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">Sí, Eliminar Item</button>
                            <a href="{% url 'items_lista' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
