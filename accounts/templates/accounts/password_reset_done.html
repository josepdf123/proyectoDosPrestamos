<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%; max-width: 440px;
            border-radius: 16px; border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="card p-5 text-center">
        <div style="font-size: 64px;">📬</div>
        <h4 class="fw-bold mt-3">¡Correo enviado!</h4>
        <p class="text-muted mt-2">
            Hemos enviado un enlace de recuperación a tu correo.
            Revisa también tu carpeta de <strong>spam</strong>.
        </p>
        <hr>
        <p class="text-muted" style="font-size: 13px;">
            El enlace expirará en <strong>10 minutos</strong>.
        </p>
        <a href="/login/" class="btn btn-outline-secondary mt-2">← Volver al login</a>
    </div>
</body>
</html>
